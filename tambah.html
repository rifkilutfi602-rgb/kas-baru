<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Kas - KasKita</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2><i class="fa-solid fa-wallet"></i> KasKita</h2>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="iuran.html"><i class="fa-solid fa-users"></i> Status Iuran</a></li>
                <li><a href="tambah.html" class="active"><i class="fa-solid fa-circle-plus"></i> Input Kas</a></li>
                <li><a href="laporan.html"><i class="fa-solid fa-file-lines"></i> Laporan</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <h3>Form Pencatatan Kas Masuk / Keluar</h3>
                <span class="user-badge"><i class="fa-solid fa-user-shield"></i> Bendahara</span>
            </header>

            <section>
                <h2>Form Tambah Transaksi Baru</h2>
                <form id="kasForm">
                    <div class="form-group">
                        <label>Keterangan Transaksi</label>
                        <input type="text" id="keterangan" required placeholder="Contoh: Iuran Minggu ke-2 / Beli Spidol">
                    </div>
                    <div class="form-group">
                        <label>Jenis Transaksi</label>
                        <select id="jenis">
                            <option value="Masuk">Pemasukan (Iuran / Sumbangan)</option>
                            <option value="Keluar">Pengeluaran (Keperluan Kelas)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nominal (Rp)</label>
                        <input type="number" id="nominal" required placeholder="50000">
                    </div>
                    <button type="submit" class="btn-submit">Simpan Transaksi</button>
                </form>
            </section>
        </main>
    </div>

    <script>
        // Skrip sederhana untuk menangani submit form
        document.getElementById('kasForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const ket = document.getElementById('keterangan').value;
            const jenis = document.getElementById('jenis').value;
            const nominal = document.getElementById('nominal').value;

            alert(`Berhasil!\nTransaksi "${ket}" (${jenis}) senilai Rp ${nominal} berhasil disimpan.`);
            this.reset();
        });
    </script>
</body>
</html>
